[program:stub-default-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/stub/artisan queue:work --queue=default
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=root
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/stub/default_worker.log
stopwaitsecs=3600
